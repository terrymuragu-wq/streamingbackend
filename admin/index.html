<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitStream Admin</title>
<style>
:root{--bg:#0b0e14;--panel:#131824;--panel2:#1a2130;--text:#e8ecf4;--muted:#8b95ab;--accent:#6c5ce7;--green:#00b894;--red:#e74c3c;--amber:#fdcb6e;--border:#232c3f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;font:inherit}
.hidden{display:none!important}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% -10%,#6c5ce733,transparent),radial-gradient(900px 500px at 90% 110%,#00b89422,transparent),var(--bg)}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:40px;width:min(400px,92vw);box-shadow:0 30px 80px #000a;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0}}
.login-card h1{font-size:26px;background:linear-gradient(90deg,#a29bfe,#00cec9);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-card p{color:var(--muted);margin:6px 0 22px;font-size:14px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);margin-bottom:12px;font-size:14px;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6c5ce733}
.btn{background:linear-gradient(135deg,#6c5ce7,#4834d4);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-weight:600;width:100%;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #6c5ce755}
.btn.sm{width:auto;padding:7px 14px;font-size:13px;border-radius:8px}
.btn.ghost{background:var(--panel2);border:1px solid var(--border)}
.btn.green{background:linear-gradient(135deg,#00b894,#019875)}
.btn.red{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.err{background:#e74c3c22;border:1px solid #e74c3c55;color:#ff8a80;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
/* layout */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:800;background:linear-gradient(90deg,#a29bfe,#00cec9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11px;background:var(--accent);color:#fff;padding:3px 10px;border-radius:99px}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:6px;padding:12px 24px;flex-wrap:wrap;background:var(--bg)}
.tab{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:8px 18px;font-size:13px;position:relative;transition:.2s}
.tab.active{background:linear-gradient(135deg,#6c5ce7,#4834d4);color:#fff;border-color:transparent}
.tab .badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{padding:10px 24px 60px;max-width:1200px;margin:0 auto}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;animation:rise .4s both}
.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}.stat:nth-child(4){animation-delay:.15s}
.stat:nth-child(5){animation-delay:.2s}.stat:nth-child(6){animation-delay:.25s}.stat:nth-child(7){animation-delay:.3s}.stat:nth-child(8){animation-delay:.35s}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.stat .v{font-size:26px;font-weight:800}.stat .l{color:var(--muted);font-size:12px;margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
/* table */
table{width:100%;border-collapse:collapse;margin-top:14px;background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 14px;background:var(--panel2)}
td{padding:12px 14px;border-top:1px solid var(--border);font-size:13.5px;vertical-align:middle}
tr:hover td{background:#ffffff06}
.pill{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
.pill.green{background:#00b89422;color:#55efc4}.pill.red{background:#e74c3c22;color:#ff8a80}
.pill.amber{background:#fdcb6e22;color:#fdcb6e}.pill.blue{background:#74b9ff22;color:#74b9ff}
.pill.purple{background:#6c5ce722;color:#a29bfe}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;vertical-align:middle;margin-right:8px}
h2.sec{margin:26px 0 4px;font-size:18px}
p.sub{color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--green);color:var(--text);padding:14px 20px;border-radius:12px;box-shadow:0 10px 40px #000a;animation:pop .3s;z-index:99;font-size:14px;max-width:340px}
.toast.err{border-color:var(--red)}
.broadcast-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row input,.row select,.row textarea{margin-bottom:0}
@media(max-width:720px){table{font-size:12px}th,td{padding:8px}.topbar{padding:12px 14px}main{padding:8px 12px 40px}}
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <h1>⚡ FitStream Admin</h1>
    <p>Platform control center — restricted access</p>
    <div id="loginErr"></div>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" onclick="login()">Sign in</button>
    <p style="margin-top:14px;font-size:12px">Demo: admin@fitstream.io / admin123</p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo">⚡ FitStream</div><span class="tag">ADMIN</span>
    <div class="spacer"></div>
    <span id="who" style="font-size:13px;color:var(--muted)"></span>
    <button class="btn sm ghost" onclick="logout()">Log out</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <main id="content"></main>
</div>

<script>
const API = location.origin + '/api';
let token = localStorage.getItem('fsa_token') || '';
const $ = s => document.querySelector(s);
const money = c => '$' + (c / 100).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const date = s => s ? new Date(s.includes('T')||s.includes('Z') ? s : s.replace(' ','T')+'Z').toLocaleString() : '—';

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed (' + r.status + ')');
  return data;
}
function toast(msg, isErr) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}
async function login() {
  $('#loginErr').innerHTML = '';
  try {
    const d = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#email').value, password: $('#password').value }) });
    if (d.user.role !== 'admin') throw new Error('This account is not an admin');
    token = d.token; localStorage.setItem('fsa_token', token);
    boot();
  } catch (e) { $('#loginErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function logout() { token = ''; localStorage.removeItem('fsa_token'); location.reload(); }

const TABS = [
  ['overview', '📊 Overview'], ['coaches', '🏋️ Coaches'], ['content', '🎬 Content'],
  ['lives', '🔴 Live'], ['users', '👥 Users'], ['agencies', '🏢 Agencies'],
  ['withdrawals', '🏦 Withdrawals'], ['transactions', '💳 Transactions'], ['broadcast', '📢 Broadcast'],
];
let currentTab = 'overview';
let badges = {};

async function boot() {
  $('#loginView').classList.add('hidden');
  $('#app').classList.remove('hidden');
  try {
    const me = await api('/auth/me');
    $('#who').textContent = me.user.name + ' (admin)';
    renderTabs();
    show('overview');
  } catch (e) { logout(); }
}
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label]) =>
    `<button class="tab ${id === currentTab ? 'active' : ''}" onclick="show('${id}')">${label}${badges[id] ? `<span class="badge">${badges[id]}</span>` : ''}</button>`).join('');
}
async function show(tab) {
  currentTab = tab; renderTabs();
  const el = $('#content');
  el.innerHTML = '<p class="sub" style="margin-top:20px">Loading…</p>';
  try { await ({ overview, coaches, content, lives, users, agencies, withdrawals, transactions, broadcast })[tab](); }
  catch (e) { el.innerHTML = `<div class="err" style="margin-top:20px">${esc(e.message)}</div>`; }
}

async function overview() {
  const o = await api('/admin/overview');
  badges = { coaches: o.pendingCoaches, content: o.pendingContent, withdrawals: o.pendingWithdrawals };
  renderTabs();
  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v">${o.users}</div><div class="l">Total users</div></div>
      <div class="stat"><div class="v">${o.clients}</div><div class="l">Clients</div></div>
      <div class="stat"><div class="v">${o.coaches}</div><div class="l">Coaches</div></div>
      <div class="stat"><div class="v" style="color:#ff7675">${o.liveNow}</div><div class="l">Live now</div></div>
      <div class="stat"><div class="v">${o.purchases}</div><div class="l">Purchases</div></div>
      <div class="stat"><div class="v" style="color:#55efc4">${money(o.platformRevenueCents)}</div><div class="l">Platform revenue</div></div>
      <div class="stat"><div class="v" style="color:#fdcb6e">${o.pendingCoaches}</div><div class="l">Coach reviews</div></div>
      <div class="stat"><div class="v" style="color:#fdcb6e">${o.pendingContent}</div><div class="l">Content queue</div></div>
    </div>
    <h2 class="sec">Quick actions</h2><p class="sub">Common admin tasks</p>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" onclick="show('coaches')">Review coaches</button>
      <button class="btn sm" onclick="show('content')">Moderate content</button>
      <button class="btn sm" onclick="show('withdrawals')">Withdrawals</button>
      <button class="btn sm ghost" onclick="show('broadcast')">Send broadcast</button>
    </div>`;
}

async function coaches() {
  const rows = await api('/admin/coaches');
  $('#content').innerHTML = `<h2 class="sec">Coach eligibility review</h2>
    <p class="sub">Coaches must be approved here before they can stream or publish. They must belong to an agency first.</p>
    <table><tr><th>Coach</th><th>Specialty</th><th>Agency</th><th>Rating</th><th>Status</th><th>Actions</th></tr>
    ${rows.map(c => `<tr>
      <td><span class="avatar" style="background:${c.avatar_color}">${esc(c.name[0])}</span>${esc(c.name)}<br><span style="color:var(--muted);font-size:12px">${esc(c.email)}</span></td>
      <td>${esc(c.specialty)}</td>
      <td>${esc(c.agency_name || '— none —')}</td>
      <td>${c.avg_rating ? '⭐ ' + c.avg_rating : '—'}</td>
      <td>${c.live_now ? '<span class="pill red">🔴 LIVE</span> ' : ''}${c.approved ? '<span class="pill green">Approved</span>' : '<span class="pill amber">Pending</span>'}</td>
      <td class="actions">
        ${c.approved
          ? `<button class="btn sm red" onclick="coachApprove(${c.id},false)">Revoke</button>`
          : `<button class="btn sm green" onclick="coachApprove(${c.id},true)">Approve</button>`}
        <button class="btn sm ghost" onclick="msgUser(${c.id})">Message</button>
      </td></tr>`).join('') || '<tr><td colspan="6">No coaches yet</td></tr>'}
    </table>`;
}
async function coachApprove(id, approve) {
  try { await api(`/admin/coaches/${id}/approve`, { method: 'POST', body: JSON.stringify({ approve }) });
    toast(approve ? 'Coach approved ✅' : 'Approval revoked'); coaches(); } catch (e) { toast(e.message, true); }
}

async function content() {
  const rows = await api('/admin/content');
  $('#content').innerHTML = `<h2 class="sec">Content moderation</h2>
    <p class="sub">Approve content before it appears in the client catalog. Locked items require payment to view.</p>
    <table><tr><th>Title</th><th>Coach</th><th>Type</th><th>Price</th><th>Status</th><th>Actions</th></tr>
    ${rows.map(c => `<tr>
      <td>${esc(c.title)}<br><span style="color:var(--muted);font-size:12px">${esc(c.description).slice(0, 60)}</span></td>
      <td>${esc(c.coach_name)}</td><td><span class="pill purple">${c.type}</span></td>
      <td>${c.price_cents ? money(c.price_cents) : 'Free'}</td>
      <td>${c.status === 'approved' ? '<span class="pill green">Approved</span>' : c.status === 'rejected' ? '<span class="pill red">Rejected</span>' : '<span class="pill amber">Pending</span>'}</td>
      <td class="actions">
        <a class="btn sm ghost" href="${esc(c.url)}" target="_blank" rel="noopener">Preview</a>
        ${c.status !== 'approved' ? `<button class="btn sm green" onclick="contentDecide(${c.id},true)">Approve</button>` : ''}
        ${c.status !== 'rejected' ? `<button class="btn sm red" onclick="contentDecide(${c.id},false)">Reject</button>` : ''}
      </td></tr>`).join('') || '<tr><td colspan="6">No content yet</td></tr>'}
    </table>`;
}
async function contentDecide(id, approve) {
  try { await api(`/admin/content/${id}/decide`, { method: 'POST', body: JSON.stringify({ approve }) });
    toast(approve ? 'Content approved ✅' : 'Content rejected'); content(); } catch (e) { toast(e.message, true); }
}

async function lives() {
  const rows = await api('/admin/lives');
  $('#content').innerHTML = `<h2 class="sec">Live sessions</h2><p class="sub">Monitor and end any session.</p>
    <table><tr><th>Title</th><th>Coach</th><th>Price</th><th>Viewers</th><th>Status</th><th>Scheduled</th><th></th></tr>
    ${rows.map(l => `<tr>
      <td>${esc(l.title)}</td><td>${esc(l.coach_name)}</td>
      <td>${l.price_cents ? money(l.price_cents) : 'Free'}</td><td>${l.viewers}</td>
      <td>${l.status === 'live' ? '<span class="pill red">🔴 LIVE</span>' : l.status === 'scheduled' ? '<span class="pill blue">Scheduled</span>' : '<span class="pill">Ended</span>'}</td>
      <td>${date(l.scheduled_at)}</td>
      <td class="actions">${l.status === 'live' ? `<button class="btn sm red" onclick="endLive(${l.id})">End now</button>` : ''}</td>
    </tr>`).join('') || '<tr><td colspan="7">No sessions yet</td></tr>'}
    </table>`;
}
async function endLive(id) {
  if (!confirm('End this live session immediately?')) return;
  try { await api(`/lives/${id}/end`, { method: 'POST', body: '{}' }); toast('Session ended'); lives(); }
  catch (e) { toast(e.message, true); }
}

async function users() {
  const rows = await api('/admin/users');
  $('#content').innerHTML = `<h2 class="sec">User management</h2><p class="sub">Suspend or reactivate any account. Suspended users are logged out and blocked.</p>
    <table><tr><th>User</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
    ${rows.map(u => `<tr>
      <td><span class="avatar" style="background:${u.avatar_color}">${esc(u.name[0])}</span>${esc(u.name)}<br><span style="color:var(--muted);font-size:12px">${esc(u.email)}</span></td>
      <td><span class="pill ${u.role === 'admin' ? 'red' : u.role === 'coach' ? 'purple' : u.role === 'manager' ? 'blue' : 'green'}">${u.role}</span></td>
      <td>${u.status === 'active' ? '<span class="pill green">Active</span>' : u.status === 'suspended' ? '<span class="pill red">Suspended</span>' : '<span class="pill amber">Pending</span>'}</td>
      <td>${date(u.created_at)}</td>
      <td class="actions">${u.role !== 'admin' ? `
        ${u.status === 'suspended'
          ? `<button class="btn sm green" onclick="userStatus(${u.id},'active')">Reactivate</button>`
          : `<button class="btn sm red" onclick="userStatus(${u.id},'suspended')">Suspend</button>`}
        <button class="btn sm ghost" onclick="msgUser(${u.id})">Message</button>` : ''}
      </td></tr>`).join('')}
    </table>`;
}
async function userStatus(id, status) {
  if (status === 'suspended' && !confirm('Suspend this user? They will be blocked immediately.')) return;
  try { await api(`/admin/users/${id}/status`, { method: 'POST', body: JSON.stringify({ status }) });
    toast(status === 'suspended' ? 'User suspended' : 'User reactivated'); users(); } catch (e) { toast(e.message, true); }
}
async function msgUser(id) {
  const text = prompt('Message to send to this user:');
  if (!text) return;
  try { await api(`/admin/users/${id}/message`, { method: 'POST', body: JSON.stringify({ text }) }); toast('Message sent'); }
  catch (e) { toast(e.message, true); }
}

async function agencies() {
  const rows = await api('/admin/agencies');
  $('#content').innerHTML = `<h2 class="sec">Agencies</h2><p class="sub">Registered agencies and their managers.</p>
    <table><tr><th>Agency</th><th>Manager</th><th>Coaches</th><th>Manager status</th></tr>
    ${rows.map(a => `<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.manager_name)}</td><td>${a.coach_count}</td>
      <td>${a.manager_status === 'active' ? '<span class="pill green">Active</span>' : '<span class="pill red">Suspended</span>'}</td></tr>`).join('') || '<tr><td colspan="4">No agencies yet</td></tr>'}
    </table>`;
}

async function withdrawals() {
  const rows = await api('/wallet/withdrawals');
  $('#content').innerHTML = `<h2 class="sec">Withdrawal requests</h2><p class="sub">Approve to release funds from the coach's balance.</p>
    <table><tr><th>Coach</th><th>Amount</th><th>Requested</th><th>Status</th><th>Actions</th></tr>
    ${rows.map(w => `<tr>
      <td>${esc(w.coach_name)}</td><td><b>${money(w.amount_cents)}</b></td><td>${date(w.created_at)}</td>
      <td>${w.status === 'approved' ? '<span class="pill green">Approved</span>' : w.status === 'rejected' ? '<span class="pill red">Rejected</span>' : '<span class="pill amber">Pending</span>'}</td>
      <td class="actions">${w.status === 'pending' ? `
        <button class="btn sm green" onclick="decideW(${w.id},true)">Approve</button>
        <button class="btn sm red" onclick="decideW(${w.id},false)">Reject</button>` : ''}</td>
    </tr>`).join('') || '<tr><td colspan="5">No withdrawals yet</td></tr>'}
    </table>`;
}
async function decideW(id, approve) {
  try { await api(`/wallet/withdrawals/${id}/decide`, { method: 'POST', body: JSON.stringify({ approve }) });
    toast(approve ? 'Withdrawal approved ✅' : 'Withdrawal rejected'); withdrawals(); } catch (e) { toast(e.message, true); }
}

async function transactions() {
  const rows = await api('/admin/transactions');
  $('#content').innerHTML = `<h2 class="sec">Transactions</h2><p class="sub">Latest 200 wallet movements.</p>
    <table><tr><th>User</th><th>Type</th><th>Amount</th><th>Note</th><th>When</th></tr>
    ${rows.map(t => `<tr>
      <td>${esc(t.name)}<br><span style="color:var(--muted);font-size:12px">${esc(t.email)}</span></td>
      <td><span class="pill blue">${t.kind}</span></td>
      <td style="color:${t.amount_cents >= 0 ? '#55efc4' : '#ff8a80'}">${t.amount_cents >= 0 ? '+' : ''}${money(t.amount_cents)}</td>
      <td>${esc(t.note)}</td><td>${date(t.created_at)}</td></tr>`).join('') || '<tr><td colspan="5">No transactions yet</td></tr>'}
    </table>`;
}

async function broadcast() {
  $('#content').innerHTML = `<h2 class="sec">Broadcast</h2><p class="sub">Send an in-app notification to all users or one role.</p>
    <div class="broadcast-card">
      <div class="row">
        <select id="brole" style="max-width:180px">
          <option value="">Everyone</option><option value="client">Clients only</option>
          <option value="coach">Coaches only</option><option value="manager">Managers only</option>
        </select>
        <input id="btext" placeholder="Announcement text…" style="flex:1;min-width:220px">
        <button class="btn sm" onclick="sendBroadcast()">Send 📢</button>
      </div>
    </div>`;
}
async function sendBroadcast() {
  const text = $('#btext').value.trim(), role = $('#brole').value;
  if (!text) return toast('Write a message first', true);
  try { await api('/admin/broadcast', { method: 'POST', body: JSON.stringify({ text, role: role || undefined }) });
    $('#btext').value = ''; toast('Broadcast sent 📢'); } catch (e) { toast(e.message, true); }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter' && !$('#loginView').classList.contains('hidden')) login(); });
if (token) boot();
</script>
</body>
</html>
