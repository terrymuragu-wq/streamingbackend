services:
  - type: web
    name: adultblog-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: adultblog-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@adultblog.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/adultblog.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGIN
        value: "*"
